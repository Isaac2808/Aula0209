<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Food Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #FFF8E8;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            background: #E63946;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
        }

        /* =========================
           BOTÃO VOLTAR
        ========================== */

        .back-btn {
            text-decoration: none;
            background: #2A9D8F;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            transition: all .3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .15);
        }

        .back-btn:hover {
            background: #23867B;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, .20);
        }

        /* =========================
           LAYOUT
        ========================== */

        .container {
            display: flex;
            flex: 1;
        }

        /* =========================
           MENU LATERAL
        ========================== */

        .sidebar {
            width: 250px;
            background: white;
            padding: 20px;
            border-right: 2px solid #eee;
        }

        .sidebar h2 {
            color: #E63946;
            margin-bottom: 20px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px;
            margin-bottom: 10px;
            background: #f7f7f7;
            border-radius: 8px;
            transition: .3s;
        }

        .sidebar li:hover {
            background: #FF9F1C;
            color: white;
            cursor: pointer;
        }

        /* =========================
           CONTEÚDO
        ========================== */

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* =========================
           FORMULÁRIO
        ========================== */

        .form-box {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .10);
        }

        .form-box h2 {
            text-align: center;
            color: #E63946;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: .3s;
        }

        input:focus {
            outline: none;
            border-color: #FF9F1C;
            box-shadow: 0 0 0 3px rgba(255, 159, 28, .15);
        }

        /* =========================
           BOTÃO CADASTRAR
        ========================== */

        .btn {
            width: 100%;
            padding: 14px;
            background: #E63946;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: .3s;
        }

        .btn:hover {
            background: #C72B38;
            transform: translateY(-1px);
        }

        /* =========================
           LINK LOGIN
        ========================== */

        .link-login {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .link-login a {
            color: #E63946;
            font-weight: bold;
            text-decoration: none;
        }

        .link-login a:hover {
            color: #C72B38;
            text-decoration: underline;
        }

        /* =========================
           MENSAGENS DJANGO
        ========================== */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* =========================
           FOOTER
        ========================== */

        footer {
            background: #5A3825;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 768px) {

            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            header h1 {
                font-size: 26px;
            }

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid #eee;
            }

            .sidebar ul {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .sidebar li {
                margin-bottom: 0;
            }

            .main {
                padding: 25px 15px;
            }

            .form-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>🍔 Food Store</h1>

        <a href="{% url 'app' %}" class="back-btn">
            ← 🏠 Voltar para Loja
        </a>

    </header>


    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================== -->

    <div class="container">

        <!-- MENU LATERAL -->

        <aside class="sidebar">

            <h2>Menu</h2>

            <ul>
                <li>🍔 Hambúrgueres</li>
                <li>🍕 Pizzas</li>
                <li>🥤 Bebidas</li>
                <li>🍰 Sobremesas</li>
                <li>🔥 Promoções</li>
            </ul>

        </aside>


        <!-- ÁREA PRINCIPAL -->

        <main class="main">

            <div class="form-box">

                <h2>Cadastro de Cliente</h2>


                <!-- MENSAGENS DO DJANGO -->

                {% if messages %}

                    <div class="messages">

                        {% for message in messages %}

                            <div class="message {{ message.tags }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}


                <!-- FORMULÁRIO -->

                <form method="POST">

                    {% csrf_token %}


                    <!-- NOME -->

                    <div class="form-group">

                        <label for="nome">
                            Nome Completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- E-MAIL -->

                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- SENHA -->

                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- CONFIRMAR SENHA -->

                    <div class="form-group">

                        <label for="confirmar_senha">
                            Confirmar Senha
                        </label>

                        <input
                            type="password"
                            id="confirmar_senha"
                            name="confirmar_senha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>


                    <!-- BOTÃO -->

                    <button type="submit" class="btn">
                        Cadastrar
                    </button>

                </form>


                <!-- LOGIN -->

                <div class="link-login">

                    <p>
                        Possui conta?
                        <a href="{% url 'login' %}">
                            Entrar | Login
                        </a>
                    </p>

                </div>

            </div>

        </main>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>
        <p>🍔 Food Store © 2026</p>
    </footer>

</body>
</html>
